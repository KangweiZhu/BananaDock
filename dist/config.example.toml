# bananadock configuration.
#
# Copy to ~/.config/bananadock/config.toml. Every value below is the default, so an
# empty file behaves exactly like this one and you only need to write the lines
# you want to change.
#
# The file is re-read the moment it changes -- there is no need to restart.

# Size of the icon artwork, in points. Purely horizontal: growing it widens
# the dock but never changes its height, unless the icon outgrows the panel
# entirely. Leave it out to follow the reference (43pt).
#icon_size = 43.0

# Horizontal gap between icons, in points. Only spaces the row out -- the
# panel's height never follows it.
#icon_spacing = 21.0

# Height of the panel, in points. The panel holds this height while icons
# resize inside it. Leave it out to follow the reference (85pt).
#panel_height = 85.0

# Legacy: tile pitch in points, the centre-to-centre spacing of icons.
# Superseded by icon_spacing; still honoured when icon_spacing is unset, so
# old files keep their geometry.
#tile_size = 64.0

# Pitch at full magnification, directly under the pointer.
large_size = 128.0

magnification = true

# How far the pointer's influence reaches, in tiles.
magnification_range = 2.5

# Slide the dock off-screen when the pointer is elsewhere. A thin strip along
# the screen edge brings it back. While auto-hiding, the dock reserves no space,
# so windows get the whole screen.
auto_hide = false

# How much tint sits over the blurred desktop behind the panel: 0 is clear
# glass, 1 a solid slab. Leave it out to follow the reference, which is only a
# few percent -- the dock's look comes from the blur, and tint mostly washes it
# out. Raise it for a dock that reads as a panel over a busy wallpaper.
#panel_tint = 0.12

# Width of the panel's rim, in points; 0 leaves it off. The rim is what makes
# the capsule an object rather than a patch of blur, so it earns more than its
# one point on a busy wallpaper -- and less on a plain one.
#border_width = 1.0

# Panel corner radius as a fraction of its height. 0.5 makes the ends
# semicircular -- the capsule macOS uses -- and 0 makes it a plain rectangle.
panel_radius = 0.5

# Space between the end icons and the panel's edges, in points. This is what
# makes the panel wider than the row of icons it holds.
panel_padding = 8.0

# Which screen edge the dock sits on: "bottom", "left", "right" or "top".
position = "bottom"

# "system" follows the desktop's light/dark setting, as macOS does: the panel,
# the running dots, the menus and the hover label all flip together. Set
# "light" or "dark" to pin the dock to one of them regardless.
appearance = "system"

# Space between the dock and the screen edge it sits on, in points. Moves the
# dock; maximised windows follow it, since the space underneath still belongs
# to the dock.
bottom_gap = 8.0

# Space between the dock and the windows above it, in points. Moves the
# windows, not the dock. Zero puts a maximised window's edge exactly on the
# dock's top edge, which is what macOS does.
window_gap = 0.0

# Whether a launching application's icon hops until it is up -- macOS's
# "Animate opening applications". The hop is the only sign a click did anything
# while an application is still starting.
launch_bounce = true

show_trash = true

# Whether a minimised window gets its own tile to the right of the applications,
# as macOS does. Set to false for macOS's "Minimize windows into application
# icon" behaviour, where a minimised window only shows through its app's icon.
separate_minimized = true
#
# On KWin the tile shows the window itself, provided the desktop entry carries
# X-KDE-DBUS-Restricted-Interfaces=org.kde.KWin.ScreenShot2. Without that it
# falls back to the application's icon.

# Icon theme name. Unset follows the desktop's own setting, read from KDE's or
# GTK's configuration.
# icon_theme = "breeze"

# Which screen to sit on, by connector name as your compositor reports it
# (`DP-1`, `eDP-1`, `HDMI-A-1`). Unset lets the compositor choose, which is
# normally the focused screen. Changing this needs a restart.
# output = "DP-1"

# Applications kept in the dock, by desktop entry id, in the order they appear.
# The dock rewrites this array when you drag icons around or use "Keep in Dock";
# the rest of this file, comments included, is left untouched.
pinned = []
